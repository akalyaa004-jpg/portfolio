<!-- ================= CONTACT ================= -->

<section id="contact" class="section contact-section">

    <div class="container">

        <div class="row align-items-center">


            <div class="col-lg-5">

                <p class="small-title">
                    CONTACT
                </p>

                <h2>
                    Let's build something together
                </h2>

                <p>
                    I am open to opportunities and would
                    be happy to connect.
                </p>

            </div>


            <div class="col-lg-7">

                <form>


                    <div class="mb-3">

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Full name">

                    </div>


                    <div class="mb-3">

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Email address">

                    </div>


                    <div class="mb-3">

                        <input
                            type="tel"
                            class="form-control"
                            placeholder="Phone number">

                    </div>


                    <div class="mb-3">

                        <textarea
                            class="form-control"
                            rows="5"
                            placeholder="Message">
                        </textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </div>

</section>
